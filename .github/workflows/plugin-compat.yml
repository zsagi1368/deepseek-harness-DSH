name: Plugin Compatibility Test

on:
  push:
    paths:
      - 'packages/**'
      - '.github/workflows/plugin-compat.yml'
  pull_request:
    paths:
      - 'packages/**'
      - '.github/workflows/plugin-compat.yml'

jobs:
  compat-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run plugin compatibility tests
        run: pnpm test --filter=@deepseek-ai/dsh-plugin-compat
